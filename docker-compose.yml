services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: gambler_admin
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: gambler
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: